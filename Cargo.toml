[package]
name = "ohmy-vault"
version = "0.1.0"
edition = "2021"
description = "My Personal Vault: an encrypted personal vault built with Rust and WebAssembly"
publish = false

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Clipboard",
    "Storage",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Blob",
    "File",
    "FileReader",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "HtmlAnchorElement",
    "Url",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1